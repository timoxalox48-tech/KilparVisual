
name: Build Kilpar Visual

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract source
        run: |
          unzip -q KilparVisual-1.21.11-source.zip
          sed -i 's/RepositoriesMode.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/' KilparVisual-1.21.11/settings.gradle

      - name: Build mod
        run: cd KilparVisual-1.21.11 && gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: KilparVisual
          path: KilparVisual-1.21.11/build/libs/*.jar
